<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delegation</title>
</head>
<body>
    <ul id="taskList">
        <li>Task 1 <button class="delete-btn" data-action="delete" data-id="1">Delete</button></li>
        <li>Task 2 <button class="delete-btn" data-action="delete" data-id="2">Delete</button></li>
    </ul>

</body>
<script>
    const taskList = document.querySelector('#taskList'); // Corrected selector
    taskList.addEventListener('click', function(event) {
        const deleteButton = event.target.closest('button[data-action="delete"]'); // Corrected data-action value
        if (!deleteButton) return;
        console.log(`Delete task with ID: ${deleteButton.dataset.id}`);
    });
</script>
</html>
