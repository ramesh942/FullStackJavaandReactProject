<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Profile Finder & Bookmarks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>GitHub Developer Finder</h2>

  <!-- Load app.js as an ES6 Module -->
  <script type="module" src="app.js"></script>
</body>
</html>
