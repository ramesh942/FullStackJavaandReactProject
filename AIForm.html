<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy Product Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 id="Heading">Welcome to ShopEasy Product Store</h1>
    </header>
    <main>
        <section>
            <h2>Add Product</h2>
            <form action="/add-product" method="POST">
                <label for="product-name">Product Name:</label>
                <input type="text" id="product-name" name="product-name" placeholder="Enter product name" required>
                <label for="product-price">Product Price:</label>
                <input type="number" id="product-price" name="product-price" placeholder="Enter product price" required>
                <button  id = "submit" type="submit">Add Product</button>
            </form>
        </section>
        <section>
            <h2>Product List</h2>
            <table id="product-table">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Product Price</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Server-side code will populate this table -->
                    <!-- Example static rows -->
                    <tr>
                        <td>Example Product 1</td>
                        <td>$10.00</td>
                    </tr>
                    <tr>
                        <td>Example Product 2</td>
                        <td>$20.00</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
<script type="module" src="debounce.js"></script>
</html>
